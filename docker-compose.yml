x-app-env: &app-env
  # Checked-in stack: local simulation/development only.
  NODE_ENV: development
  PUBLIC_SCHEME: https
  PUBLIC_BASE_URL: https://hermes-dev-2.tallofam.com
  SESSION_COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://lake_tech:lake_tech_local_dev@postgres:5432/lake_tech
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-simulation-only-change-this-32-char-key}
  SESSION_HMAC_SECRET: ${SESSION_HMAC_SECRET:-simulation-session-change-this-32-key}
  TERMINAL_SECRET_ENCRYPTION_KEY: ${TERMINAL_SECRET_ENCRYPTION_KEY:-simulation-terminal-encryption-key-change-this}
  SIMULATION_MODE: "true"
  SL_BOT_SIMULATION_MODE: "false"
  ALLOW_SIMULATION_IN_PRODUCTION: "true"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lake_tech
      POSTGRES_PASSWORD: lake_tech_local_dev
      POSTGRES_DB: lake_tech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lake_tech -d lake_tech"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://lake_tech:lake_tech_local_dev@postgres:5432/lake_tech
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  seed:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://lake_tech:lake_tech_local_dev@postgres:5432/lake_tech
      TERMINAL_SECRET_ENCRYPTION_KEY: ${TERMINAL_SECRET_ENCRYPTION_KEY:-simulation-terminal-encryption-key-change-this}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment: *app-env
    ports:
      - "4000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  sl-bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    environment:
      <<: *app-env
      SL_BOT_USERNAME: ${SL_BOT_USERNAME:-}
      SL_BOT_PASSWORD: ${SL_BOT_PASSWORD:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"SELECT 1 FROM bot_health WHERE heartbeat_at>now()-interval '20 seconds' AND adapter_connected\")).then(r=>{if(!r.rowCount)process.exitCode=1}).catch(()=>process.exitCode=1).finally(()=>c.end())"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
  payment-worker:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    command: ["node", "apps/sl-bot/dist/payment-worker.js"]
    environment:
      <<: *app-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"SELECT 1 FROM bot_health WHERE worker_id='payment-worker' AND heartbeat_at>now()-interval '20 seconds' AND adapter_connected\")).then(r=>{if(!r.rowCount)process.exitCode=1}).catch(()=>process.exitCode=1).finally(()=>c.end())"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  callback-worker:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    command: ["node", "apps/sl-bot/dist/callback-worker.js"]
    environment:
      <<: *app-env
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"SELECT 1 FROM bot_health WHERE worker_id='callback-worker' AND heartbeat_at>now()-interval '30 seconds' AND adapter_connected\")).then(r=>{if(!r.rowCount)process.exitCode=1}).catch(()=>process.exitCode=1).finally(()=>c.end())"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  postgres_data:
